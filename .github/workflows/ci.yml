name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test production JAR collection
        run: python .github/scripts/test_targets.py

      - name: Find build targets
        id: find
        run: |
          targets=$(python .github/scripts/targets.py list)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build ${{ matrix.target }}
        run: ./gradlew ":${{ matrix.target }}:build"

      - name: Verify production JAR
        run: python .github/scripts/targets.py collect "${{ matrix.target }}"

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: BuildingWands-${{ matrix.target }}-${{ github.sha }}
          path: build/release-jars/*.jar
          if-no-files-found: error
