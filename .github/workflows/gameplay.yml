name: Gameplay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gametest:
    name: Fabric 1.21.1 GameTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Run server gameplay tests
        run: ./gradlew "-Dorg.gradle.java.home=$JAVA_HOME" :1.21.1-fabric:runGameTest
