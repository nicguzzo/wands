name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to release'
        required: true
        type: string
      changelog:
        description: 'Changelog text (markdown). If empty, reads from CHANGELOG.md.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — build and upload artifacts but skip publishing'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod metadata
        id: meta
        run: |
          mod_version=$(grep 'modVersion' build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_name=Building Wands ${mod_version}" >> "$GITHUB_OUTPUT"

      - name: Build MC version support list
        id: mc_versions
        run: |
          {
            echo "text<<MC_EOF"
            echo "### Supported Minecraft Versions"
            for dir in versions/*/; do
              name=$(basename "$dir")
              mc_ver=$(grep '^deps.minecraft=' "$dir/gradle.properties" | cut -d= -f2)
              loader="${name##*-}"
              echo "- **${mc_ver}** — ${loader}"
            done
            echo "MC_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Determine changelog
        id: changelog
        run: |
          if [[ -n "${{ inputs.changelog }}" ]]; then
            cat <<'CHLOG_EOF' > /tmp/changelog.txt
          ${{ inputs.changelog }}
          CHLOG_EOF
          else
            version="${{ steps.meta.outputs.mod_version }}"
            sed -n "/^## ${version}$/,/^## /{/^## ${version}$/d;/^## /d;p}" CHANGELOG.md > /tmp/changelog.txt
          fi

          if [[ ! -s /tmp/changelog.txt ]]; then
            echo "No changelog found for version ${{ steps.meta.outputs.mod_version }}" > /tmp/changelog.txt
          fi

          # Combine MC versions + changelog into release body
          {
            echo "body<<BODY_EOF"
            echo "${{ steps.mc_versions.outputs.text }}"
            echo ""
            cat /tmp/changelog.txt
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          # Changelog only (for CurseForge/Modrinth — they don't need MC list)
          {
            echo "text<<CHLOG_EOF"
            cat /tmp/changelog.txt
            echo "CHLOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build all targets
        run: |
          chmod +x ./gradlew
          for dir in versions/*/; do
            target=$(basename "$dir")
            echo "::group::Building $target"
            ./gradlew ":${target}:build" -Pfabric.loom.disable_file_lock=true
            echo "::endgroup::"
          done

      - name: Publish to CurseForge and Modrinth
        if: ${{ !inputs.dry_run }}
        run: |
          for dir in versions/*/; do
            target=$(basename "$dir")
            ./gradlew ":${target}:publishMods" -Pfabric.loom.disable_file_lock=true
          done
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          WANDS_CHANGELOG: ${{ steps.changelog.outputs.text }}

      - name: Upload release JARs
        uses: actions/upload-artifact@v4
        with:
          name: BuildingWands-${{ steps.meta.outputs.mod_version }}
          retention-days: 90
          path: |
            versions/*/build/libs/BuildingWands-*.jar
            !**/*-dev-shadow.jar
            !**/*-sources.jar

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.mod_version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: false
          files: |
            versions/*/build/libs/BuildingWands-*.jar
            !**/*-dev-shadow.jar
            !**/*-sources.jar
