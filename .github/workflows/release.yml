name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to release'
        required: true
        type: string
      changelog:
        description: 'Changelog text (markdown). If empty, reads from CHANGELOG.md.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — build and upload artifacts but skip publishing'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Read mod metadata
        id: meta
        run: |
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          release_type=$(grep '^release_channel=' gradle.properties | cut -d= -f2)
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

          if [[ "$release_type" == "release" ]]; then
            echo "release_name=Building Wands ${mod_version}" >> "$GITHUB_OUTPUT"
          else
            echo "release_name=Building Wands ${mod_version}-${release_type}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        env:
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          MOD_VERSION: ${{ steps.meta.outputs.mod_version }}
        run: |
          if [[ -n "$INPUT_CHANGELOG" ]]; then
            printf '%s\n' "$INPUT_CHANGELOG" > "$RUNNER_TEMP/changelog.md"
          else
            awk -v heading="## $MOD_VERSION" '$0 == heading { found=1; next } /^## / { found=0 } found' CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
          fi
          if [[ ! -s "$RUNNER_TEMP/changelog.md" ]]; then
            echo "Building Wands $MOD_VERSION" > "$RUNNER_TEMP/changelog.md"
          fi
          { echo "### Supported Minecraft Versions"; python .github/scripts/targets.py describe; echo; cat "$RUNNER_TEMP/changelog.md"; } > "$RUNNER_TEMP/release.md"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build all targets
        run: ./gradlew build

      - name: Verify all production JARs
        run: python .github/scripts/targets.py collect

      - name: Publish to CurseForge and Modrinth
        if: ${{ !inputs.dry_run }}
        run: |
          export WANDS_CHANGELOG="$(cat "$RUNNER_TEMP/changelog.md")"
          ./gradlew publishMods
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Upload release JARs
        uses: actions/upload-artifact@v5
        with:
          name: BuildingWands-${{ steps.meta.outputs.mod_version }}
          retention-days: 90
          path: build/release-jars/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.mod_version }}
          target_commitish: ${{ env.RELEASE_COMMIT }}
          name: ${{ steps.meta.outputs.release_name }}
          body_path: ${{ runner.temp }}/release.md
          prerelease: ${{ steps.meta.outputs.release_type != 'release' }}
          files: build/release-jars/*.jar
          fail_on_unmatched_files: true
