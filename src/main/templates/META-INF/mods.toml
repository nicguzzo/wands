modLoader = "javafml"
loaderVersion = "[2,)"
issueTrackerURL = "${mod_issue_tracker}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    description = '''${mod_description}'''
    authors = "${mod_author}"

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    ordering = "NONE"
    side = "BOTH"
    versionRange="${forge_version_range}"


[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange="${minecraft_version_range}"

[[dependencies.${mod_id}]]
    modId = "cloth_config"
    mandatory = true
    versionRange="[${cloth_config_version},)"
    ordering = "NONE"
    side = "BOTH"